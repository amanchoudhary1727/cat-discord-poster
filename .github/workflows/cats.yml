name: Cat Poster

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"

  # Allows manual testing from GitHub
  workflow_dispatch:

jobs:
  post-cat:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run Cat Poster
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python cat_poster.py
